name: Validate saMGRO Binary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check server JavaScript
        run: node --check server.js
      - name: Check browser JavaScript
        run: |
          node --check app.js
          node --check auth.js
